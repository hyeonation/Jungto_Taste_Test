<html lang="ko">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      user-select: none;
    }

    /* Header Controls */
    .toolbar {
      width: 1280px;
      background: #1e293b;
      padding: 14px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }

    .toolbar-title {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #475569;
      color: #ffffff;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-success {
      background: #059669;
      border-color: #10b981;
      color: #ffffff;
    }

    .btn-success:hover {
      background: #047857;
    }

    .btn-danger {
      background: #dc2626;
      border-color: #ef4444;
      color: #ffffff;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    /* Main Editor Canvas */
    .canvas-container {
      position: relative;
      width: 1280px;
      height: 720px;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      background-image: 
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Stage Background Zones */
    .stage-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
    }

    .zone-taste {
      left: 0;
      width: 420px;
      background: rgba(240, 253, 244, 0.5);
      border-right: 2px dashed #cbd5e1;
    }

    .zone-intro {
      left: 420px;
      width: 440px;
      background: rgba(254, 252, 232, 0.5);
      border-right: 2px dashed #cbd5e1;
    }

    .zone-advanced {
      left: 860px;
      width: 420px;
      background: rgba(238, 242, 255, 0.5);
    }

    .zone-title {
      font-size: 28px;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 8px;
    }

    .zone-taste .zone-title { color: #065f46; }
    .zone-intro .zone-title { color: #92400e; }
    .zone-advanced .zone-title { color: #3730a3; }

    /* Draggable Canvas Elements */
    .drag-node {
      position: absolute;
      cursor: move;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      background: #ffffff;
      border: 2px solid #cbd5e1;
      min-width: 80px;
      min-height: 40px;
    }

    .drag-node.selected {
      outline: 3px solid #3b82f6 !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5) !important;
      z-index: 999 !important;
    }

    .drag-node .node-text {
      outline: none;
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      text-align: center;
    }

    .drag-node .node-icon {
      font-size: 20px;
      margin-right: 8px;
    }

    /* Specialized Styles */
    .node-gate {
      flex-direction: column;
      border-style: dashed !important;
      border-width: 3px !important;
      padding: 14px;
      text-align: center;
    }

    .node-gate-1 {
      background: #fffbe8 !important;
      border-color: #f59e0b !important;
      color: #78350f !important;
    }

    .node-gate-2 {
      background: #eef2ff !important;
      border-color: #6366f1 !important;
      color: #312e81 !important;
    }

    .node-pure-text {
      background: transparent !important;
      border: 1px dashed transparent !important;
      box-shadow: none !important;
    }

    .node-pure-text:hover {
      border-color: #cbd5e1 !important;
    }

    /* Helper instruction overlay */
    .info-bar {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>

        <i class="fa-solid fa-file-powerpoint"></i> PPTX 파일로 다운로드

  <!-- Canvas -->
  <div class="canvas-container" id="editorCanvas">
    
    <!-- Background Zones -->

    <!-- Draggable Elements initialized via JS -->
  </div>

  <div class="info-bar">

    <span>✏️ <b>글자 수정</b>: 텍스트를 클릭하여 자유롭게 내용을 바꾸세요.</span>
    <span>💾 <b>PPTX 저장</b>: [PPTX 파일로 다운로드] 버튼을 누르면 파워포인트에서 100% 수정 가능한 파일로 다운로드됩니다.</span>

  <script>
    const initialElements = [
      // --- 맛보기 (Taste) ---
      { id: 'el-1', text: '명상', icon: 'fa-spa', iconColor: '#10b981', left: 40, top: 120, bg: '#ffffff', border: '#cbd5e1' },

      { id: 'el-3', text: '즉문즉설', icon: 'fa-comments', iconColor: '#10b981', left: 150, top: 230, bg: '#ffffff', border: '#cbd5e1' },

      // --- 입문 (Introductory) ---
      { id: 'el-7', text: '불교대학', icon: 'fa-graduation-cap', iconColor: '#f59e0b', left: 460, top: 120, bg: '#ffffff', border: '#cbd5e1' },

      { id: 'el-12', text: '나눔의 장', icon: 'fa-users', iconColor: '#f59e0b', left: 490, top: 460, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-13', text: '천일결사 기도', icon: 'fa-hands-praying', iconColor: '#f59e0b', left: 630, top: 420, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-14', text: '동북아 역사기행', icon: 'fa-compass', iconColor: '#f59e0b', left: 480, top: 580, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-15', text: '인도 성지순례', icon: 'fa-place-of-worship', iconColor: '#f59e0b', left: 650, top: 560, bg: '#ffffff', border: '#cbd5e1' },

      // --- 관문 2 (Gate 2) ---
      { id: 'el-gate2', text: '만 배 (만 번의 숙임)', icon: 'fa-torii-gate', iconColor: '#4f46e5', left: 780, top: 320, bg: '#eef2ff', border: '#6366f1', isGate: true, gateNum: '관문 2' },

      // --- 심화 (Advanced) ---
      { id: 'el-16', text: '전법교육', icon: 'fa-chalkboard-user', iconColor: '#6366f1', left: 910, top: 120, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-17', text: '해외 봉사', icon: 'fa-plane', iconColor: '#6366f1', left: 1040, top: 220, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-18', text: '청년붓다', icon: 'fa-user-graduate', iconColor: '#6366f1', left: 1080, top: 360, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-19', text: '백일출가', icon: 'fa-mountain-sun', iconColor: '#6366f1', left: 1060, top: 490, bg: '#ffffff', border: '#cbd5e1' },
      { id: 'el-20', text: '행자대학원', icon: 'fa-building-columns', iconColor: '#6366f1', left: 950, top: 600, bg: '#ffffff', border: '#cbd5e1' }
    ];

    let selectedElement = null;
    const canvas = document.getElementById('editorCanvas');

    function renderElements(elements) {
      // Remove existing drag nodes
      const existingNodes = canvas.querySelectorAll('.drag-node');
      existingNodes.forEach(node => node.remove());

      elements.forEach(item => {
        createNodeElement(item);
      });
    }

    function createNodeElement(item) {
      const node = document.createElement('div');
      node.className = 'drag-node' + (item.isGate ? ' node-gate' : '') + (item.isPureText ? ' node-pure-text' : '');
      if (item.isGate) {
        node.classList.add(item.gateNum === '관문 1' ? 'node-gate-1' : 'node-gate-2');
      }

      node.id = item.id;
      node.style.left = item.left + 'px';
      node.style.top = item.top + 'px';
      if (item.bg) node.style.backgroundColor = item.bg;
      if (item.border) node.style.borderColor = item.border;

      node.dataset.icon = item.icon || '';
      node.dataset.iconColor = item.iconColor || '#334155';
      node.dataset.isGate = item.isGate || false;
      node.dataset.gateNum = item.gateNum || '';

      let innerHTML = '';
      if (item.isGate) {
        innerHTML = `
          <i class="fa-solid ${item.icon} node-icon" style="color:${item.iconColor}; font-size:32px; margin-bottom:6px; margin-right:0;"></i>
          <span style="font-size:12px; font-weight:800; color:#b45309; text-transform:uppercase;">${item.gateNum}</span>
          <span class="node-text" contenteditable="true" style="font-weight:900;">${item.text}</span>
        `;
      } else {
        if (item.icon) {
          innerHTML += `<i class="fa-solid ${item.icon} node-icon" style="color:${item.iconColor}"></i>`;
        }
        innerHTML += `<span class="node-text" contenteditable="true">${item.text}</span>`;
      }

      node.innerHTML = innerHTML;

      // Click select
      node.addEventListener('pointerdown', (e) => {
        selectElement(node);
        startDragging(e, node);
      });

      // Prevent contenteditable click from starting unwanted drag
      const textSpan = node.querySelector('.node-text');
      if (textSpan) {
        textSpan.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectElement(node);
        });
      }

      canvas.appendChild(node);
    }

    function selectElement(node) {
      if (selectedElement) {
        selectedElement.classList.remove('selected');
      }
      selectedElement = node;
      selectedElement.classList.add('selected');
    }

    // Drag and drop implementation
    function startDragging(e, node) {
      if (e.target.getAttribute('contenteditable') === 'true') return;

      const rect = node.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();

      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;

      function onPointerMove(moveEvent) {
        let newLeft = moveEvent.clientX - canvasRect.left - offsetX;
        let newTop = moveEvent.clientY - canvasRect.top - offsetY;

        // Keep inside canvas bounds
        newLeft = Math.max(0, Math.min(canvasRect.width - node.offsetWidth, newLeft));
        newTop = Math.max(0, Math.min(canvasRect.height - node.offsetHeight, newTop));

        node.style.left = newLeft + 'px';
        node.style.top = newTop + 'px';
      }

      function onPointerUp() {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
      }

      document.addEventListener('pointermove', onPointerMove);
