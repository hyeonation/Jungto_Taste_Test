<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청년 페스타에서 발견한 나</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body class="bg-amber-50/60 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-amber-100 min-h-[600px] flex flex-col justify-between p-6 transition-all duration-300">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="my-auto text-center space-y-6">
      <div class="inline-block p-4 bg-emerald-100 text-emerald-700 rounded-full text-4xl mb-2">
        🌿
      </div>
      <div>
        <span class="text-xs font-bold tracking-wider text-emerald-800 uppercase bg-emerald-100 px-3 py-1 rounded-full">심리 테스트</span>
        <h1 class="text-2xl font-black text-gray-800 mt-4 leading-tight">
          청년 페스타에서<br>발견한 나
        </h1>
        <p class="text-sm text-gray-600 mt-3 leading-relaxed">
          나는 지금 어떤 경험이 필요할까?<br>지금의 나와 가장 가까운 답을 골라보세요.
        </p>
      </div>

      <button onclick="startTest()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition transform active:scale-95 text-lg">
        테스트 시작하기
      </button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-screen" class="hidden flex-col justify-between h-full space-y-6 my-auto">
      <div>
        <!-- 진행 바 -->
        <div class="w-full bg-gray-100 h-2.5 rounded-full mb-6 overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>

        <div class="flex items-center justify-between text-xs font-bold text-emerald-700 mb-2">
          <span id="question-number">Q1.</span>
          <span id="question-count">1/5</span>
        </div>

        <h2 id="question-text" class="text-lg font-bold text-gray-800 leading-snug mb-6">
          질문 내용
        </h2>

        <div id="options-container" class="space-y-3">
          <!-- 선택지 버튼 동적 생성 -->
        </div>
      </div>

      <p class="text-xs text-center text-gray-400">정답은 없어요. 끌리는 답 하나를 골라주세요.</p>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden my-auto text-center space-y-5">
      <div>
        <div id="result-icon" class="text-5xl mb-2">🔮</div>
        <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">나에게 필요한 경험</span>
        <h2 id="result-title" class="text-2xl font-black text-gray-800 mt-3"></h2>
        <p id="result-subtitle" class="text-base font-bold text-emerald-700 mt-1"></p>
      </div>

      <div class="bg-amber-50/70 p-4 rounded-2xl text-left border border-amber-100 space-y-3">
        <p id="result-desc" class="text-sm text-gray-700 leading-relaxed"></p>
        
        <div class="pt-2 border-t border-amber-200/60">
          <span class="text-xs font-bold text-gray-500 block mb-1">추천 키워드</span>
          <div id="result-keywords" class="flex flex-wrap gap-1.5">
            <!-- 키워드 태그 들어가는 곳 -->
          </div>
        </div>
      </div>

      <button onclick="restartTest()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition text-sm">
        다시 테스트하기
      </button>
    </div>

  </div>

  <script>
    const questions = [
      {
        q: "Q1. 오늘은 청년 페스타 첫날!\n나의 행동은?",
        options: [
          { text: "① 오, 설렌다! 일단 이것저것 돌아다녀보자.", type: "TEMPLE" },
          { text: "② 일단 팜플렛부터! 전체 프로그램을 파악하고 시작한다.", type: "UNIV" },
          { text: "③ 사람들이 뭐 하는지 천천히 구경한다. 분위기를 먼저 느껴본다.", type: "HAPPY" },
          { text: "④ 오늘 여기 온 김에 평소 안 해보던 것까지 제대로 해보고 싶다.", type: "AWAKENING" }
        ]
      },
      {
        q: "Q2. 걷다가 법륜스님과 마주쳤다. 나의 반응은?",
        options: [
          { text: "① “스님! 안녕하세요!” 일단 반갑게 인사한다.", type: "HAPPY" },
          { text: "② “어… 어디서 뵌 분 같은데?” 일단 지나간다.", type: "TEMPLE" },
          { text: "③ “스님, 궁금한 게 있는데요!” 평소 궁금했던 걸 물어본다.", type: "UNIV" },
          { text: "④ “나한테도 궁금한 게 하나 있는데…” 괜히 내 삶을 돌아보게 된다.", type: "AWAKENING" }
        ]
      },
      {
        q: "Q3. 모르는 사람이 친근하게 말을 건다!",
        options: [
          { text: "① “누구세요?” 모르는 사람은 일단 경계한다.", type: "TEMPLE" },
          { text: "② “아… 하하, 안녕하세요.” 어색하지만 일단 받아준다.", type: "HAPPY" },
          { text: "③ “안녕하세요!” 나도 자연스럽게 말을 건다.", type: "UNIV" },
          { text: "④ 우연한 만남이 인연이 될지도?! 열린마음으로 일단 이야기를 들어본다.", type: "AWAKENING" }
        ]
      },
      {
        q: "Q4. 누군가 묻는다.\n“당신에게 행복이란 무엇인가요?”",
        options: [
          { text: "① “재밌는 거 하고 좋아하는 사람이랑 놀면 행복하지~”", type: "TEMPLE" },
          { text: "② “잠깐만… 행복이 뭘까?” 쉽게 대답하기 어렵다.", type: "AWAKENING" },
          { text: "③ “행복하다고 느낀지 오래된 거 같아..”", type: "HAPPY" },
          { text: "④ “내가 어떻게 살아야 행복할 수 있는지 알고 싶어.”", type: "UNIV" }
        ]
      },
      {
        q: "Q5. 이제 집에 돌아갈 시간이다.\n오늘 하루를 떠올리며 가장 가까운 생각은?",
        options: [
          { text: "① “오늘 재밌었다! 다음에 또 와야지.”", type: "TEMPLE" },
          { text: "② “생각보다 궁금한 게 많네. 좀 더 알아보고 싶다.”", type: "HAPPY" },
          { text: "③ “잠깐 멈춰서 나를 돌아볼 수 있어서 좋았다.”", type: "UNIV" },
          { text: "④ “이상하다. 오늘 내가 어떻게 살고 싶은지 생각하게 됐다.”", type: "AWAKENING" }
        ]
      }
    ];

    const results = {
      TEMPLE: {
        title: "☕ 도심 속 절캉스",
        subtitle: "“일단 잠깐 멈춰볼래?”",
        icon: "☕",
        desc: "새로운 것을 경험해보고 싶지만 너무 무거운 시작은 부담스러운 당신.\n잠시 일상을 내려놓고, 내 마음을 가볍게 들여다보는 시간을 가져보세요.\n도심 속 절캉스는 반나절 동안 명상하고 내 마음을 살펴보면서, 잠시 일상의 속도를 늦춰볼 수 있어요.",
        keywords: ["쉼", "경험", "명상", "마음 살피기"]
      },
      HAPPY: {
        title: "🌱 행복학교",
        subtitle: "“조금 더 행복하게 살아볼래?”",
        icon: "🌱",
        desc: "거창한 변화보다는 지금의 일상과 내 마음을 조금씩 바꿔보고 싶은 당신.\n내가 행복하지 않은 이유를 돌아보고, 일상에서 행복을 연습해보세요.\n행복학교는 1주일에 1시간, 4주 프로그램으로 온라인에서 법륜스님의 즉문즉설을 보고 참가자들과 나누며 행복을 배우고 연습하는 과정으로 소개되고 있어요.",
        keywords: ["행복", "관계", "일상", "변화"]
      },
      UNIV: {
        title: "📖 불교대학",
        subtitle: "“이번에는 제대로 알아볼래?”",
        icon: "📖",
        desc: "그냥 좋은 말을 듣는 것보다 ‘왜 그런지’ 알고 싶은 당신.\n삶과 마음에 대해 차근차근 배우고, 배운 것을 일상에서 직접 적용해보고 싶다면.\n정토불교대학은 5개월 동안 법문, 마음나누기, 수행연습 등을 통해 불교의 가르침을 일상에 적용해보는 과정이에요.",
        keywords: ["배움", "이해", "질문", "수행"]
      },
      AWAKENING: {
        title: "🔥 깨달음의 장",
        subtitle: "“나를 한번 제대로 만나볼래?”",
        icon: "🔥",
        desc: "평소의 나를 잠시 내려놓고 내가 어떤 생각과 욕망을 가지고 살아가는지 깊이 돌아보고 싶은 당신.\n정토수련원의 4박 5일 수련 프로그램으로 안내되고 있으며, 평생 한 번 참여할 수 있는 프로그램이에요.\n조금 더 깊은 자기성찰의 시간을 가져보세요.",
        keywords: ["성찰", "내려놓기", "나", "삶"]
      }
    };

    let currentQuestion = 0;
    let scores = { TEMPLE: 0, HAPPY: 0, UNIV: 0, AWAKENING: 0 };

    function startTest() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('quiz-screen').classList.add('flex');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-number').innerText = `Q${currentQuestion + 1}.`;
      document.getElementById('question-count').innerText = `${currentQuestion + 1}/${questions.length}`;
      document.getElementById('question-text').innerText = q.q;

      const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-gray-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition duration-150 text-sm font-medium text-gray-700 flex items-center justify-between group active:scale-[0.99]";
        btn.innerHTML = `
          <span>${opt.text}</span>
          <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-emerald-500 text-xs shrink-0 ml-2"></i>
        `;
        btn.onclick = () => selectOption(opt.type);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(type) {
      scores[type]++;
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('flex');
      document.getElementById('result-screen').classList.remove('hidden');

      // 최고 점수 유형 계산
      let highestType = 'TEMPLE';
      let maxScore = -1;

      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          highestType = type;
        }
      }

      const res = results[highestType];

      document.getElementById('result-icon').innerText = res.icon;
      document.getElementById('result-title').innerText = res.title;
      document.getElementById('result-subtitle').innerText = res.subtitle;
      document.getElementById('result-desc').innerText = res.desc;

      const keywordsContainer = document.getElementById('result-keywords');
      keywordsContainer.innerHTML = res.keywords.map(kw => 
        `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-medium"># ${kw}</span>`
      ).join('');
    }

    function restartTest() {
      currentQuestion = 0;
      scores = { TEMPLE: 0, HAPPY: 0, UNIV: 0, AWAKENING: 0 };
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
